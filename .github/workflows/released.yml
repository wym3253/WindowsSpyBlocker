name: released

permissions:
  contents: read

on:
  release:
    types:
      - published

jobs:
  virustotal:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to write GitHub Release body
    steps:
      -
        name: VirusTotal Monitor Scan
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_MONITOR_API_KEY }}
          vt_monitor: true
          monitor_path: /${{ github.event.repository.name }}/${{ github.event.release.tag_name }}
          update_release_body: false
          files: |
            WindowsSpyBlocker.exe
      -
        name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          files: |
            WindowsSpyBlocker.exe
